<div class="min-h-screen bg-gray-100">

  <div class="max-w-2xl mx-auto p-4">

    <!-- NAVBAR -->
    <app-navbar class="flex justify-between items-center mb-6"></app-navbar>
    <!-- NAVBAR -->

    <!-- CREATE POST -->
    <app-create-post></app-create-post>
    <!-- CREATE POST -->

    <div class="space-y-4">

      @for(post of postsStore.posts(); track post.id) {

      <div class="bg-white p-4 rounded-2xl shadow">

        <!-- POSTS -->
        <app-post-card (eventToggleLike)="postsStore.toggleLike($event)" [post]="post"></app-post-card>
        <!-- POSTS -->

        <!-- COMMENTS -->
        <div class="space-y-2">
          @for(comment of post.comments; track comment.id) {
          <app-comments-item [comment]="comment"></app-comments-item>
          }
        </div>
        <!-- COMMENTS -->

        <!-- ADD COMMENT -->
        <app-comments-form class="flex gap-2 mt-4" [post]="post"></app-comments-form>
        <!-- ADD COMMENT -->
      </div>
      }
    </div>

  </div>

</div>
