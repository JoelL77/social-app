<form class="w-full flex gap-2 mt-4" [formGroup]="form" (ngSubmit)="sendComment()">
    <input formControlName="comment" #commentInput placeholder="Agregar comentario..."
        class="flex-1 border rounded-xl p-2" />

    <button type="submit" class="bg-black text-white px-4 rounded-xl">
        Enviar
    </button>
</form>
